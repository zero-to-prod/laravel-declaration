calls:
  - method: afterResolving
    args:
      - Illuminate\Routing\Router
      - - {method: model, args: [airline, ZeroToProd\LaravelDeclaration\Tests\Fixtures\App\Models\Airline]}
        - method: addRoute
          args: [GET, "airlines/{airline}/flights", ZeroToProd\LaravelDeclaration\DeclaredView]
          then:
            - {method: middleware, args: [Illuminate\Routing\Middleware\SubstituteBindings]}
            - {method: setDefaults, args: [{view: flights, data: {title: Flights List, flights: airline-flights}}]}
  - method: afterResolving
    args:
      - Illuminate\View\Factory
      - - {method: addLocation, args: [resources/declared-views]}

models:
  - class: ZeroToProd\LaravelDeclaration\Tests\Fixtures\App\Models\Airline
    table: airlines
    fillable: [name]
    timestamps: false

  - class: ZeroToProd\LaravelDeclaration\Tests\Fixtures\App\Models\Flight
    table: my_flights
    primaryKey: flight_id
    keyType: string
    incrementing: false
    fillable: [flight_id, airline_id, name, code, status, delayed, departed_at, secret, options, altitude]
    casts:
      delayed: boolean
      options: array

queries:
  - name: all-flights
    model: ZeroToProd\LaravelDeclaration\Tests\Fixtures\App\Models\Flight
    select: [flight_id, name, code, status]
    orderBy: flight_id

  - name: active-flights
    model: ZeroToProd\LaravelDeclaration\Tests\Fixtures\App\Models\Flight
    where: [status, active]
    get: true

  - name: airline-flights
    relation: airline.flights
    where: [status, active]
    paginate: 5

  - name: flight-count
    model: ZeroToProd\LaravelDeclaration\Tests\Fixtures\App\Models\Flight
    count: true
