schema:
  - {method: dropIfExists, args: [scratch]}
  - {method: drop, args: [legacy]}
  - {method: rename, args: [old_users, users]}
  - method: create
    args:
      - people
      - - {method: id}
        - {method: string, args: [title, 100]}
        - {method: string, args: [user_id]}
        - {method: timestamps}
  - method: table
    args:
      - ghost
      - - {method: string, args: [phantom]}
  - method: table
    args:
      - people
      - - {method: string, args: [nickname, 64]}
        - {method: string, args: [title, 200], then: [{method: change}]}
        - {method: integer, args: [priority], then: [{method: default, args: [0]}]}
        - {method: dropColumn, args: [obsolete]}
        - {method: renameColumn, args: [user_id, owner_id]}
        - {method: renameIndex, args: [people_title_index, people_title_ft]}
        - {method: dropIndex, args: [people_title_index]}
        - {method: index, args: [[owner_id, priority]], then: [{method: nullsNotDistinct}]}
        - {method: foreign, args: [owner_id], then: [{method: references, args: [id]}, {method: on, args: [people]}, {method: cascadeOnDelete}]}
        - {method: dropTimestamps}
  - method: table
    args:
      - users
      - - {method: dropForeign, args: [[user_id]]}        # Blueprint::dropForeign($index): an array of columns resolves the index name
