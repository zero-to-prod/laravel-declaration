# yaml-language-server: $schema=./../../../manifest.schema.json

schema:
  dropIfExists:
    - scratch
  drop:
    - legacy
  rename:
    old_users: users
  create:
    people:
      id: ~
      string:
        - column: title
          length: 100
        - column: user_id
      timestamps: ~
  table:
    ghost:
      string:
        - column: phantom
    people:
      string:
        - column: nickname
          length: 64
        - column: title
          length: 200
          change: ~
      integer:
        - column: priority
          default: 0
      dropColumn:
        - obsolete
      renameColumn:
        from: user_id
        to: owner_id
      renameIndex:
        from: people_title_index
        to: people_title_ft
      dropIndex:
        - people_title_index
      index:
        - columns: [owner_id, priority]
          nullsNotDistinct: ~
      foreign:
        - columns: owner_id
          on: people
          references: id
          cascadeOnDelete: ~
      dropTimestamps: ~
    users:
      dropForeign:
        - user_id
