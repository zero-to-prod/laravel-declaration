
# The route-registrar surface spelled with the test fixtures' class-strings. Every key
# under the Router is one Router method; a row's extra keys ride the returned Route or
# Pending*Registration; a group's `routes` map is a body on the router inside the group.

afterResolving:
  Illuminate\Routing\Router:
    # ResourceRegistrar's statics are process-global: pin the defaults these tests assert so a
    # manifest that sets them in the same PHP process (router.yml) cannot leak into them.
    singularResourceParameters: true
    resourceParameters: {}
    resourceVerbs:
      create: create
      edit: edit

    # Router::addRoute($methods, $uri, $action) — one row per call
    addRoute:
      - uri: "/"
        methods: GET
        action: ZeroToProd\LaravelDeclaration\Tests\Fixtures\App\MockController
        name: home

      - uri: "todos/{todo}"
        methods: DELETE
        action: ZeroToProd\LaravelDeclaration\Tests\Fixtures\App\MockController
        metadata:
          request: delete-todo
        setDefaults:
          target: todo
          call: delete
          redirect: todos.index

    # Router::group($attributes, $routes) — the native attributes array + a nested body (recursive)
    group:
      - attributes:
          prefix: admin
          as: admin.
          namespace: ZeroToProd\LaravelDeclaration\Tests\Fixtures\App\Routing\Admin
          middleware: [web]                      # `auth` would 401 the unauthenticated dispatch tests
          where:
            id: '[0-9]+'
          metadata:
            area: admin
        routes:
          addRoute:
            - uri: dashboard
              methods: GET
              action: DashboardController        # namespace attribute -> ...\Routing\Admin\DashboardController
              name: dashboard                    # as attribute        -> admin.dashboard
          resource:
            - name: users
              controller: UserController         # -> ...\Routing\Admin\UserController (namespace)
              middlewareFor:                     # one middlewareFor($methods, $middleware) per item
                destroy: [can:delete-users]
          group:                                 # nested group: prefix/as/namespace concatenate
            - attributes:
                prefix: settings
                as: settings.
              routes:
                addRoute:
                  - uri: profile
                    methods: GET
                    action: ProfileController
                    name: profile               # -> admin.settings.profile, URI admin/settings/profile

      - attributes:
          domain: "{account}.example.com"       # group domain; route parameters bind natively
        routes:
          addRoute:
            - uri: tenants
              methods: GET
              action: ZeroToProd\LaravelDeclaration\Tests\Fixtures\App\MockController

    # Router::resource($name, $controller) — the other keys ride the PendingResourceRegistration
    resource:
      - name: photos
        controller: ZeroToProd\LaravelDeclaration\Tests\Fixtures\App\Routing\PhotoController
        only: {methods: [index, show, store, update, destroy]}
        middleware: [web]
        whereNumber: photo                     # -> whereNumber('photo')
        scoped: ~                              # -> scoped()             (bindingFields: [])
        withTrashed: [show, edit, update]      # -> withTrashed([show, edit, update])
        shallow: ~                             # -> shallow()            (shallow nested names)
        names:
          index: gallery.index
        missing: ZeroToProd\LaravelDeclaration\Tests\Fixtures\App\UserMissingHandler   # a `closure` reference, called ($request, $exception)

    # Router::apiResource() — resource minus create/edit
    apiResource:
      - name: posts
        controller: ZeroToProd\LaravelDeclaration\Tests\Fixtures\App\MockController
        except: {methods: [destroy]}

    # Router::singleton() / apiSingleton() — show/edit/update defaults
    singleton:
      - name: profile
        controller: ZeroToProd\LaravelDeclaration\Tests\Fixtures\App\MockController
        creatable: ~                           # adds create/store/destroy
    apiSingleton:
      - name: avatar
        controller: ZeroToProd\LaravelDeclaration\Tests\Fixtures\App\MockController

    # Router::view() — native static-view shortcut (GET|HEAD; bypasses DeclaredView)
    view:
      - uri: about
        view: pages.about
        data:
          title: About
        headers:
          X-Frame-Options: DENY
        middleware: [web]                      # rides the returned Route

    # Router::redirect() / permanentRedirect()
    redirect:
      - uri: "old-posts/{post}"
        destination: "posts/{post}"
        status: 302
        where:                                 # rides the returned Route
          post: '[0-9]+'
    permanentRedirect:
      - uri: legacy
        destination: /
