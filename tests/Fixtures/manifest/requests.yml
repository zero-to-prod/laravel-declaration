requests:
  - name: user
    authorize: ZeroToProd\LaravelDeclaration\Tests\Fixtures\App\Requests\Gates\AllowUser
    rules:
      name: [required, string, max:255]
      nickname: nullable|string|max:32
      email:
        - required
        - email
        - 'ZeroToProd\LaravelDeclaration\Tests\Fixtures\App\Requests\Rules\TenantEmailRule::forRequest'
        - 'ZeroToProd\LaravelDeclaration\Tests\Fixtures\App\Requests\declared_tenant_email'
      slug: [required, 'ZeroToProd\LaravelDeclaration\Tests\Fixtures\App\Requests\Rules\Slug']
      code: [['regex', '/^ok$/']]
    messages:
      name.required: A name is required.
    attributes:
      email: email address
    prepareForValidation: 'ZeroToProd\LaravelDeclaration\Tests\Fixtures\App\Requests\Hooks\TitleCaseName@handle'
    after:
      - 'ZeroToProd\LaravelDeclaration\Tests\Fixtures\App\Requests\Hooks\ValidateUserStatus'
    errorBag: user
    stopOnFirstFailure: true
    shouldFailOnUnknownFields: true
    bogus: ignored

  - name: data
    rules:
      name: [required, string]
      extra: [required, string]
    validationData: 'ZeroToProd\LaravelDeclaration\Tests\Fixtures\App\Requests\Hooks\ExtraData@handle'
    passedValidation: 'ZeroToProd\LaravelDeclaration\Tests\Fixtures\App\Requests\Hooks\FlagPassed@handle'
    redirectRoute: home
    redirectAction: 'ZeroToProd\LaravelDeclaration\Tests\Fixtures\App\RequestController@avatar'

  - name: avatar
    authorize: ZeroToProd\LaravelDeclaration\Tests\Fixtures\App\Requests\Gates\AllowUser
    validator: 'ZeroToProd\LaravelDeclaration\Tests\Fixtures\App\Requests\Hooks\AvatarValidator@make'
    withValidator: 'ZeroToProd\LaravelDeclaration\Tests\Fixtures\App\Requests\Hooks\WithValidator@handle'
    redirect: /failed
    errorBag: avatar

  - name: custom-failure
    rules:
      name: required
    messages: 'ZeroToProd\LaravelDeclaration\Tests\Fixtures\App\Requests\Hooks\CustomMessages@handle'
    attributes: 'ZeroToProd\LaravelDeclaration\Tests\Fixtures\App\Requests\Hooks\CustomAttributes@handle'
    prepareForValidation: 'ZeroToProd\LaravelDeclaration\Tests\Fixtures\App\Requests\declared_prepare'
    failedValidation: 'ZeroToProd\LaravelDeclaration\Tests\Fixtures\App\Requests\Hooks\RespondWithJson@handle'

  - name: denied
    authorize: false
    failedAuthorization: 'ZeroToProd\LaravelDeclaration\Tests\Fixtures\App\Requests\Hooks\Unauthorized@handle'

  - name: forbidden
    authorize: false

  - name: granted
    authorize: 'ZeroToProd\LaravelDeclaration\Tests\Fixtures\App\Requests\Gates\ResponseGate'
    rules:
      name: [required, string]

calls:
  - method: afterResolving
    args:
      - Illuminate\Routing\Router
      - - {method: addRoute, args: [POST, users, [ZeroToProd\LaravelDeclaration\Tests\Fixtures\App\RequestController, store]], then: [{method: metadata, args: [{request: user}]}]}
        - {method: addRoute, args: [POST, data, [ZeroToProd\LaravelDeclaration\Tests\Fixtures\App\RequestController, store]], then: [{method: metadata, args: [{request: data}]}]}
        - {method: addRoute, args: [POST, avatar, [ZeroToProd\LaravelDeclaration\Tests\Fixtures\App\RequestController, avatar]], then: [{method: middleware, args: [web]}, {method: metadata, args: [{request: avatar}]}]}
        - {method: addRoute, args: [POST, hooks, [ZeroToProd\LaravelDeclaration\Tests\Fixtures\App\RequestController, hook]], then: [{method: metadata, args: [{request: custom-failure}]}]}
        - {method: addRoute, args: [POST, denied, [ZeroToProd\LaravelDeclaration\Tests\Fixtures\App\RequestController, store]], then: [{method: metadata, args: [{request: denied}]}]}
        - {method: addRoute, args: [POST, forbidden, [ZeroToProd\LaravelDeclaration\Tests\Fixtures\App\RequestController, store]], then: [{method: metadata, args: [{request: forbidden}]}]}
        - {method: addRoute, args: [POST, granted, [ZeroToProd\LaravelDeclaration\Tests\Fixtures\App\RequestController, store]], then: [{method: metadata, args: [{request: granted}]}]}
        # names an undeclared request
        - {method: addRoute, args: [POST, ghost, [ZeroToProd\LaravelDeclaration\Tests\Fixtures\App\RequestController, store]], then: [{method: metadata, args: [{request: undeclared}]}]}
        # no `metadata.request`: the type-hint still resolves, and fails
        - {method: addRoute, args: [POST, untyped, [ZeroToProd\LaravelDeclaration\Tests\Fixtures\App\RequestController, store]]}


