calls:
  - method: afterResolving
    args:
      - Illuminate\Routing\Router
      - - {method: model, args: [user, ZeroToProd\LaravelDeclaration\Tests\Fixtures\App\Routing\User]}
        - method: addRoute
          args: [GET, "users/{user}/posts", ZeroToProd\LaravelDeclaration\DeclaredView]
          then:
            - {method: middleware, args: [Illuminate\Routing\Middleware\SubstituteBindings]}
            - {method: metadata, args: [{request: post-filters}]}
            - method: setDefaults
              args:
                - view: users.posts
                  data:
                    title: Posts
                    posts: ZeroToProd\LaravelDeclaration\Tests\Fixtures\App\View\Data\UserPosts
                    stats: ZeroToProd\LaravelDeclaration\Tests\Fixtures\App\View\Data\PostStats@forUser
                    user: shadowed
                    status: 200
                    headers: {Cache-Control: private}

        - method: addRoute
          args: [GET, "greet/{name}", ZeroToProd\LaravelDeclaration\DeclaredView]
          then:
            - method: setDefaults
              args:
                - view: [missing, plain]
                  data:
                    greeting: ZeroToProd\LaravelDeclaration\Tests\Fixtures\App\View\Data\Greeting::for
                    email: ada@example.com

        - method: addRoute
          args: [GET, created, ZeroToProd\LaravelDeclaration\DeclaredView]
          then:
            - method: setDefaults
              args:
                - view: greeting
                  status: 201
                  headers: {X-Declared: 'yes'}
  - method: afterResolving
    args:
      - Illuminate\View\Factory
      - - {method: addLocation, args: [resources/declared-views]}
        - {method: share, args: [brand, Tenant Console]}

requests:
  - name: post-filters
    rules:
      sort: [nullable, 'in:created_at,title']
