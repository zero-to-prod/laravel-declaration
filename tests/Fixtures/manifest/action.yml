# yaml-language-server: $schema=./../../../manifest.schema.json

schema:
  tables:
    todos:
      id: ~
      string: title
      boolean:
        column: completed
        default: false
      timestamps: ~

router:
  model:
    todo: ZeroToProd\LaravelDeclaration\Tests\Fixtures\App\Models\Todo

requests:
  - name: create-todo
    rules:
      title: [required, string, 'max:255']

  - name: update-todo
    rules:
      title: [sometimes, required, string, 'max:255']

routes:
  - path: "todos"
    methods: POST
    action: ZeroToProd\LaravelDeclaration\DeclaredAction
    name: todos.store
    middleware: [web]
    metadata:
      request: create-todo
    setDefaults:
      model: ZeroToProd\LaravelDeclaration\Tests\Fixtures\App\Models\Todo
      call: create
      redirect: todos.index
      with:
        status: Todo created successfully!

  - path: "todos/{todo}"
    methods: PATCH
    action: ZeroToProd\LaravelDeclaration\DeclaredAction
    name: todos.update
    middleware: [web, Illuminate\Routing\Middleware\SubstituteBindings]
    metadata:
      request: update-todo
    setDefaults:
      target: todo
      call: update
      redirect: todos.index
      with:
        status: Todo updated!

  - path: "todos/{todo}/toggle"
    methods: POST
    action: ZeroToProd\LaravelDeclaration\DeclaredAction
    name: todos.toggle
    middleware: [web, Illuminate\Routing\Middleware\SubstituteBindings]
    setDefaults:
      target: todo
      call: toggle
      column: completed
      redirect: todos.index

  - path: "todos/{todo}"
    methods: DELETE
    action: ZeroToProd\LaravelDeclaration\DeclaredAction
    name: todos.destroy
    middleware: [web, Illuminate\Routing\Middleware\SubstituteBindings]
    setDefaults:
      target: todo
      call: delete
      redirect: todos.index
      with:
        status: Todo deleted!
