calls:
  - method: afterResolving
    args:
      - Illuminate\Validation\Factory                  # ——— Factory registry methods ———
      - - {method: extend, args: [uppercase, 'ZeroToProd\LaravelDeclaration\Tests\Fixtures\App\Validation\Uppercase@check']}
        - {method: extend, args: [slug, 'ZeroToProd\LaravelDeclaration\Tests\Fixtures\App\Validation\SlugExtension@check', 'The :attribute must be a slug.']}
        - {method: extendImplicit, args: [phone, 'ZeroToProd\LaravelDeclaration\Tests\Fixtures\App\Validation\Phone']}
        - {method: extendDependent, args: [guardedMin, 'ZeroToProd\LaravelDeclaration\Tests\Fixtures\App\Validation\GuardedMin@check']}
        - {method: replacer, args: [uppercase, 'ZeroToProd\LaravelDeclaration\Tests\Fixtures\App\Validation\Uppercase@replace']}
  - method: afterResolving
    args:
      - Illuminate\Routing\Router
      - - {method: addRoute, args: [POST, profile, [ZeroToProd\LaravelDeclaration\Tests\Fixtures\App\RequestController, store]], then: [{method: metadata, args: [{request: profile}]}]}

requests:
  - name: profile
    messages:
      name.uppercase: The :attribute must be uppercase (min :min).   # the replacer fills :min
    rules:                                                # ——— conditional rules (§2.6) ———
      name: [required, string, uppercase:8]               # plain rule strings resolve through the factory
      slug: [required, slug]
      phone: phone                                        # implicit: fires even when `phone` is absent
      secret: 'guardedMin:reveal,8'                       # dependent: $parameters reference other fields
      email:
        - when:                                           # ≙ Rule::when($condition, $rules, $defaultRules)
            condition: 'ZeroToProd\LaravelDeclaration\Tests\Fixtures\App\Validation\IsTeamAdmin'
            rules: [required, email]
            defaultRules: [nullable, email]
      coupon:
        - nullable
        - when:
            condition: 'ZeroToProd\LaravelDeclaration\Tests\Fixtures\App\Validation\ProTier'   # returns a Closure
            rules: 'in:pro,elite'                         # pipe string: passes through, exploded natively
      discount:
        - unless:                                         # ≙ Rule::unless(...) — $rules apply when falsy
            condition: 'ZeroToProd\LaravelDeclaration\Tests\Fixtures\App\Validation\IsTeamAdmin'
            rules: [prohibited]
      handle:
        - when:                                           # nested rule reference, container-made through rule()
            condition: 'ZeroToProd\LaravelDeclaration\Tests\Fixtures\App\Validation\IsTeamAdmin'
            rules: ['ZeroToProd\LaravelDeclaration\Tests\Fixtures\App\Requests\Rules\Slug']
      notes:                                              # whole-field form: the field value IS Rule::when(...)
        when:
          condition: false                                # bool conditions pass through untouched
          rules: [required, string]
