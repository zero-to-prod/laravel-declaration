calls:
  - method: afterResolving
    args:
      - Illuminate\Foundation\Http\Kernel
      - - {method: setMiddlewarePriority, args: [[Illuminate\Routing\Middleware\SubstituteBindings]]}
  - method: afterResolving
    args:
      - Illuminate\Routing\Router
      - - {method: model, args: [user, ZeroToProd\LaravelDeclaration\Tests\Fixtures\App\Routing\User]}
        - method: addRoute
          args: [GET, "users/{user}/posts", ZeroToProd\LaravelDeclaration\DeclaredView]
          then:
            - {method: name, args: [users.posts]}
            - {method: middleware, args: [web]}
            - {method: where, args: [user, '[0-9]+']}
            - {method: metadata, args: [{request: post-filters}]}
            - method: setDefaults
              args:
                - view: users.posts
                  data:
                    title: Posts
                    posts: user-posts
                    stats: ZeroToProd\LaravelDeclaration\Tests\Fixtures\App\View\Data\PostStats@forUser
  - method: afterResolving
    args:
      - Illuminate\View\Factory
      - - {method: addLocation, args: [resources/declared-views]}
        - {method: share, args: [brand, Tenant Console]}
        - {method: composer, args: ['*', ZeroToProd\LaravelDeclaration\Tests\Fixtures\App\View\CurrentTenant]}

requests:
  - name: post-filters
    rules:
      sort: [nullable, 'in:created_at,title']

queries:
  - name: user-posts
    relation: user.posts
    with: [author]
    latest: created_at
    paginate: 15
