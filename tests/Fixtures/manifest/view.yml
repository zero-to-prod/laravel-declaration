calls:
  - method: afterResolving
    args:
      - Illuminate\View\Factory
      - - {method: addLocation, args: [resources/declared-views]}
        - {method: prependLocation, args: [resources/declared-views/theme]}
        - {method: addNamespace, args: [admin, resources/declared-views/admin]}
        - {method: prependNamespace, args: [admin, [resources/declared-views/admin-theme]]}
        - {method: replaceNamespace, args: [legacy, resources/declared-views/admin]}
        - {method: addExtension, args: [html, blade]}
        - {method: share, args: [brand, Tenant Console]}
        - {method: share, args: [title, shared]}
        - {method: composer, args: [users.*, ZeroToProd\LaravelDeclaration\Tests\Fixtures\App\View\UserMenu]}
        - {method: composer, args: ['*', ZeroToProd\LaravelDeclaration\Tests\Fixtures\App\View\CurrentTenant]}
        - {method: composer, args: [[users.show, greeting], ZeroToProd\LaravelDeclaration\Tests\Fixtures\App\View\Menus@primary]}
        - {method: creator, args: [[users.show, greeting], ZeroToProd\LaravelDeclaration\Tests\Fixtures\App\View\Breadcrumbs]}
        - {method: creator, args: [single, ZeroToProd\LaravelDeclaration\Tests\Fixtures\App\View\Breadcrumbs]}
  - method: afterResolving
    args:
      - Illuminate\Routing\Router
      - - method: addRoute
          args: [GET, "users/{user}", Illuminate\Routing\ViewController]
          then:
            - method: setDefaults
              args:
                - view: users.show
                  data: {title: route}
                  status: 200
                  headers: {}
