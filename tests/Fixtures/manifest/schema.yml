
schema:
  create:
    users:
      id: ~
      string:
        - name
        - column: email
          unique: ~
        - password
      timestamp:
        column: email_verified_at
        nullable: ~
      rememberToken: ~
      timestamps: ~

    todos:
      id: ~
      foreignId:
        column: user_id
        constrained: users
        cascadeOnDelete: ~
      string:
        column: title
        length: 255
      text:
        column: description
        nullable: ~
      boolean:
        column: completed
        default: false
      timestamps: ~
      index:
        - [user_id, completed]

    tags:
      engine: InnoDB
      charset: utf8mb4
      collation: utf8mb4_unicode_ci
      id: ~
      string:
        column: name
        length: 50
        unique: ~
      timestamps: ~

    audits:
      id: ~
      string:
        column: user_id
      foreign:
        - columns: user_id
          on: users
          references: id
          cascadeOnDelete: ~
