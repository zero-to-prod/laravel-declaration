# yaml-language-server: $schema=./../../../manifest.schema.json

gate:
  policy:
    ZeroToProd\LaravelDeclaration\Tests\Fixtures\App\Models\Post: ZeroToProd\LaravelDeclaration\Tests\Fixtures\App\Policies\PostPolicy
  define:
    publish: ZeroToProd\LaravelDeclaration\Tests\Fixtures\App\Policies\PublishGate@publish
    update: ZeroToProd\LaravelDeclaration\Tests\Fixtures\App\Policies\PostPolicy@update   # string callback — no model binding on the route (§2.4)
    attach: ZeroToProd\LaravelDeclaration\Tests\Fixtures\App\Policies\PostPolicy@attach

requests:
  - name: listed
    authorize:
      check:
        abilities: viewAny
        arguments: ZeroToProd\LaravelDeclaration\Tests\Fixtures\App\Models\Post   # policy path — getPolicyFor($arguments[0]) (§1.3)
    rules:
      title: [required, string]

  - name: attached
    authorize:
      check:
        abilities: attach                        # no `arguments` — the array_key_exists early return
    rules:
      title: [required, string]

  - name: denied-listed
    authorize:
      inspect:
        ability: viewAny
        arguments: ZeroToProd\LaravelDeclaration\Tests\Fixtures\App\Models\Post   # class-string pass-through
    rules:
      title: [required, string]

  - name: update-post
    authorize:
      inspect:
        ability: update
        arguments: post                          # route parameter name → its bound value ('1')
    rules:
      title: [required, string]

  - name: publish-post
    authorize:
      inspect:
        ability: publish
        arguments: post                          # a `gate.define`d ability
    rules:
      title: [required, string]

  - name: ghost-argument
    authorize:
      inspect:
        ability: attach
        arguments: ghost                         # no such route parameter, unquoted → null
    rules:
      title: [required, string]

  - name: literal-argument
    authorize:
      inspect:
        ability: attach
        arguments: "'5'"                         # quoted literal → '5'
    rules:
      title: [required, string]

  - name: numbered-argument
    authorize:
      inspect:
        ability: attach
        arguments: 5                             # non-string passes through
    rules:
      title: [required, string]

  - name: list-argument
    authorize:
      inspect:
        ability: attach
        arguments: [ghost, "'5'"]                # a list resolves per entry (Rule 2) → [null, '5']
    rules:
      title: [required, string]

  - name: multi-gate
    authorize:
      check:
        abilities: viewAny
      inspect:
        ability: viewAny                         # two Gate methods → LogicException
    rules:
      title: [required, string]

routes:
  addRoute:
    - uri: listed
      methods: GET
      action: [ZeroToProd\LaravelDeclaration\Tests\Fixtures\App\RequestController, store]
      middleware: [web]
      metadata:
        request: listed

    - uri: attached
      methods: GET
      action: [ZeroToProd\LaravelDeclaration\Tests\Fixtures\App\RequestController, store]
      middleware: [web]
      metadata:
        request: attached

    - uri: denied-listed
      methods: GET
      action: [ZeroToProd\LaravelDeclaration\Tests\Fixtures\App\RequestController, store]
      middleware: [web]
      metadata:
        request: denied-listed

    - uri: "posts/{post}"
      methods: PUT
      action: [ZeroToProd\LaravelDeclaration\Tests\Fixtures\App\RequestController, store]
      middleware: [web]
      metadata:
        request: update-post

    - uri: "publish/{post}"
      methods: PUT
      action: [ZeroToProd\LaravelDeclaration\Tests\Fixtures\App\RequestController, store]
      middleware: [web]
      metadata:
        request: publish-post

    - uri: attach
      methods: POST
      action: [ZeroToProd\LaravelDeclaration\Tests\Fixtures\App\RequestController, store]
      middleware: [web]
      metadata:
        request: ghost-argument

    - uri: literal
      methods: POST
      action: [ZeroToProd\LaravelDeclaration\Tests\Fixtures\App\RequestController, store]
      middleware: [web]
      metadata:
        request: literal-argument

    - uri: numbered
      methods: POST
      action: [ZeroToProd\LaravelDeclaration\Tests\Fixtures\App\RequestController, store]
      middleware: [web]
      metadata:
        request: numbered-argument

    - uri: args-list
      methods: POST
      action: [ZeroToProd\LaravelDeclaration\Tests\Fixtures\App\RequestController, store]
      middleware: [web]
      metadata:
        request: list-argument

    - uri: multi
      methods: POST
      action: [ZeroToProd\LaravelDeclaration\Tests\Fixtures\App\RequestController, store]
      middleware: [web]
      metadata:
        request: multi-gate