calls:
  - method: afterResolving
    args:
      - Illuminate\Auth\Access\Gate
      - - {method: policy, args: [ZeroToProd\LaravelDeclaration\Tests\Fixtures\App\Models\Post, ZeroToProd\LaravelDeclaration\Tests\Fixtures\App\Policies\PostPolicy]}
        - {method: define, args: [publish, ZeroToProd\LaravelDeclaration\Tests\Fixtures\App\Policies\PublishGate@publish]}
        - {method: define, args: [update, ZeroToProd\LaravelDeclaration\Tests\Fixtures\App\Policies\PostPolicy@update]}   # string callback — no model binding on the route (§2.4)
        - {method: define, args: [attach, ZeroToProd\LaravelDeclaration\Tests\Fixtures\App\Policies\PostPolicy@attach]}
  - method: afterResolving
    args:
      - Illuminate\Routing\Router
      - - {method: addRoute, args: [GET, listed, [ZeroToProd\LaravelDeclaration\Tests\Fixtures\App\RequestController, store]], then: [{method: middleware, args: [web]}, {method: metadata, args: [{request: listed}]}]}
        - {method: addRoute, args: [GET, attached, [ZeroToProd\LaravelDeclaration\Tests\Fixtures\App\RequestController, store]], then: [{method: middleware, args: [web]}, {method: metadata, args: [{request: attached}]}]}
        - {method: addRoute, args: [GET, denied-listed, [ZeroToProd\LaravelDeclaration\Tests\Fixtures\App\RequestController, store]], then: [{method: middleware, args: [web]}, {method: metadata, args: [{request: denied-listed}]}]}
        - {method: addRoute, args: [PUT, "posts/{post}", [ZeroToProd\LaravelDeclaration\Tests\Fixtures\App\RequestController, store]], then: [{method: middleware, args: [web]}, {method: metadata, args: [{request: update-post}]}]}
        - {method: addRoute, args: [PUT, "publish/{post}", [ZeroToProd\LaravelDeclaration\Tests\Fixtures\App\RequestController, store]], then: [{method: middleware, args: [web]}, {method: metadata, args: [{request: publish-post}]}]}
        - {method: addRoute, args: [POST, attach, [ZeroToProd\LaravelDeclaration\Tests\Fixtures\App\RequestController, store]], then: [{method: middleware, args: [web]}, {method: metadata, args: [{request: ghost-argument}]}]}
        - {method: addRoute, args: [POST, literal, [ZeroToProd\LaravelDeclaration\Tests\Fixtures\App\RequestController, store]], then: [{method: middleware, args: [web]}, {method: metadata, args: [{request: literal-argument}]}]}
        - {method: addRoute, args: [POST, numbered, [ZeroToProd\LaravelDeclaration\Tests\Fixtures\App\RequestController, store]], then: [{method: middleware, args: [web]}, {method: metadata, args: [{request: numbered-argument}]}]}
        - {method: addRoute, args: [POST, args-list, [ZeroToProd\LaravelDeclaration\Tests\Fixtures\App\RequestController, store]], then: [{method: middleware, args: [web]}, {method: metadata, args: [{request: list-argument}]}]}
        - {method: addRoute, args: [POST, multi, [ZeroToProd\LaravelDeclaration\Tests\Fixtures\App\RequestController, store]], then: [{method: middleware, args: [web]}, {method: metadata, args: [{request: multi-gate}]}]}

requests:
  - name: listed
    authorize:
      check:
        abilities: viewAny
        arguments: ZeroToProd\LaravelDeclaration\Tests\Fixtures\App\Models\Post   # policy path — getPolicyFor($arguments[0]) (§1.3)
    rules:
      title: [required, string]

  - name: attached
    authorize:
      check:
        abilities: attach                        # no `arguments` — the array_key_exists early return
    rules:
      title: [required, string]

  - name: denied-listed
    authorize:
      inspect:
        ability: viewAny
        arguments: ZeroToProd\LaravelDeclaration\Tests\Fixtures\App\Models\Post   # class-string pass-through
    rules:
      title: [required, string]

  - name: update-post
    authorize:
      inspect:
        ability: update
        arguments: post                          # route parameter name → its bound value ('1')
    rules:
      title: [required, string]

  - name: publish-post
    authorize:
      inspect:
        ability: publish
        arguments: post                          # a `define`d ability
    rules:
      title: [required, string]

  - name: ghost-argument
    authorize:
      inspect:
        ability: attach
        arguments: ghost                         # no such route parameter, unquoted → null
    rules:
      title: [required, string]

  - name: literal-argument
    authorize:
      inspect:
        ability: attach
        arguments: "'5'"                         # quoted literal → '5'
    rules:
      title: [required, string]

  - name: numbered-argument
    authorize:
      inspect:
        ability: attach
        arguments: 5                             # non-string passes through
    rules:
      title: [required, string]

  - name: list-argument
    authorize:
      inspect:
        ability: attach
        arguments: [ghost, "'5'"]                # a list resolves per entry (Rule 2) → [null, '5']
    rules:
      title: [required, string]

  - name: multi-gate
    authorize:
      check:
        abilities: viewAny
      inspect:
        ability: viewAny                         # two Gate methods → LogicException
    rules:
      title: [required, string]
