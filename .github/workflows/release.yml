name: release

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
      - '[0-9]+.[0-9]+.[0-9]+-*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    uses: ./.github/workflows/check.yml

  composer-require-checker:
    uses: ./.github/workflows/composer-require-checker.yml

  release:
    name: GitHub release
    needs: [check, composer-require-checker]
    runs-on: ubuntu-latest

    permissions:
      contents: write

    env:
      TAG: ${{ github.ref_name }}
      GH_TOKEN: ${{ github.token }}
      PACKAGIST_USERNAME: ${{ secrets.PACKAGIST_USERNAME }}
      PACKAGIST_TOKEN: ${{ secrets.PACKAGIST_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Verify the tag is on main
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$TAG points at a commit that is not on main."
            exit 1
          fi

      - name: Create the release
        run: |
          case "$TAG" in
            *-*) PRERELEASE=--prerelease ;;
            *)   PRERELEASE= ;;
          esac
          gh release create "$TAG" \
            --verify-tag \
            --title "$TAG" \
            --generate-notes \
            $PRERELEASE

      # Packagist usually syncs itself through the GitHub App or a repository
      # webhook. This step is a fallback for when it does not, and is skipped
      # unless both secrets are set.
      - name: Notify Packagist
        if: env.PACKAGIST_USERNAME != '' && env.PACKAGIST_TOKEN != ''
        run: |
          curl -sSf -XPOST \
            -H 'content-type:application/json' \
            -d '{"repository":{"url":"https://github.com/${{ github.repository }}"}}' \
            "https://packagist.org/api/update-package?username=$PACKAGIST_USERNAME&apiToken=$PACKAGIST_TOKEN"
